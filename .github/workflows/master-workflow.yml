name: Master Video Generator

on:
  workflow_dispatch: # Tombol untuk menjalankan proses secara manual

jobs:
  generate-master-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Jalankan Master Generator Script
        run: |
          python master_video_generator.py

      - name: Simpan Hasil Master Video (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Video-Profesional-Siap-Upload
          path: Video_Profesional_Siap_Upload.mp4
